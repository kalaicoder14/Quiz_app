<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz App</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="quiz-container">

            <!-- Start Screen -->
            <div id="start-screen" class="text-center">
                <h1 class="quiz-title">Quiz Master</h1>

                <p class="text-muted">
                    Test your knowledge with this quick quiz!
                </p>

                <div class="quiz-info">
                    <div>
                        <strong>10</strong>
                        <span>Questions</span>
                    </div>

                    <div>
                        <strong>30</strong>
                        <span>Seconds / Question</span>
                    </div>
                </div>

                <button
                    class="btn btn-primary btn-lg mt-4"
                    onclick="startQuiz()"
                >
                    Start Quiz
                </button>
            </div>


            <!-- Quiz Screen -->
            <div id="quiz-screen" class="d-none">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span id="question-number">
                        Question 1 of 10
                    </span>

                    <span class="timer">
                        ⏱ <span id="timer">30</span>s
                    </span>
                </div>

                <!-- Progress Bar -->
                <div class="progress mb-4">
                    <div
                        id="progress-bar"
                        class="progress-bar"
                        role="progressbar"
                        style="width: 10%"
                    >
                    </div>
                </div>

                <!-- Question -->
                <h3 id="question">
                    Question goes here
                </h3>

                <!-- Options -->
                <div id="options" class="mt-4"></div>

                <!-- Next Button -->
                <button
                    id="next-btn"
                    class="btn btn-primary w-100 mt-4"
                    onclick="nextQuestion()"
                    disabled
                >
                    Next Question
                </button>

            </div>


            <!-- Result Screen -->
            <div id="result-screen" class="d-none text-center">

                <div class="result-icon">
                    🏆
                </div>

                <h1>Quiz Completed!</h1>

                <p class="text-muted">
                    Great job! Here is your result.
                </p>

                <div class="score-box">
                    <h2 id="score">
                        0 / 10
                    </h2>

                    <p id="percentage">
                        0%
                    </p>
                </div>

                <p id="result-message"></p>

                <button
                    class="btn btn-primary btn-lg mt-3"
                    onclick="restartQuiz()"
                >
                    Restart Quiz
                </button>

            </div>

        </div>
    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Custom JS -->
    <script src="script.js"></script>

</body>
</html>
